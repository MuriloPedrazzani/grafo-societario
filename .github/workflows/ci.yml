name: CI

on:
  # As branches de fase são onde o trabalho acontece; sem elas o CI só falaria
  # depois do pull request, quando corrigir já custa mais caro.
  push:
    branches: [main, "fase/**"]
  pull_request:

# Um push novo na mesma branch cancela a execução anterior, que já não interessa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: lint, type check e testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instala o pacote e as ferramentas de desenvolvimento
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Restaura o cache dos ambientes do pre-commit
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Lint, formatação e type check
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Testes
        run: pytest
