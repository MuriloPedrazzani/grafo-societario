# Executa lint, formatação e type check antes de cada commit.
# Instalar uma vez com: pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml]
        pass_filenames: false
        # O hook roda num ambiente isolado: sem isto o mypy não enxerga os tipos
        # que o pydantic publica e passaria a tratar a configuração como Any.
        additional_dependencies:
          - pydantic-settings>=2.7
          - pytest>=8.0
          - httpx>=0.28
          - tenacity>=9.0
          - typer>=0.15
