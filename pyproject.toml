[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "grafo-societario"
description = "Caminhos societários entre empresas brasileiras a partir dos dados abertos de CNPJ"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Murilo Pedrazzani", email = "murilopedrazzani@gmail.com" }]
keywords = ["cnpj", "grafo", "dados-abertos", "receita-federal", "societario"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Private :: Do Not Upload",
]
dynamic = ["version"]
dependencies = [
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "tenacity>=9.0",
    "typer>=0.15",
    "duckdb>=1.1",
    "numpy>=2.0",
    # O serving. Nem FastAPI nem uvicorn chegam perto do motor de ETL: o
    # caminho de resposta lê arrays com NumPy e a biblioteca padrão.
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.scripts]
grafo-societario = "grafo_societario.cli:main"

[project.optional-dependencies]
# Só o que a construção dos artefatos precisa, e que o serving não carrega.
# `components.py` usa `scipy.sparse.csgraph` para rotular os componentes; a API
# lê `componentes.npy` com NumPy e nunca chama o scipy. Manter os dois grupos
# separados é o que permite a imagem da Fase 8 não embarcar uma biblioteca
# científica para responder consulta sobre array pré-computado — mesmo motivo
# pelo qual `graph/csr.py` não importa DuckDB.
build = ["scipy>=1.14"]
dev = [
    "grafo-societario[build]",
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4.0",
    # Os stubs entram junto: o mypy roda em modo strict, e a saída para uma
    # biblioteca sem tipos é instalar os tipos, não afrouxar a verificação.
    "scipy-stubs>=1.14",
    # Medidor de memória residente do processo. O teste do CSR precisa afirmar
    # que mapear não carrega, e isso é sobre RSS — não sobre o valor devolvido,
    # que uma implementação que carregasse tudo também acertaria.
    "psutil>=6.0",
    "types-psutil>=6.0",
    # Geração de casos para os testes de propriedade da travessia. O valor
    # dele aqui é achar a forma de grafo que ninguém escreveria à mão, e
    # reduzir o contraexemplo ao caso mínimo.
    "hypothesis>=6.100",
]

[project.urls]
Repository = "https://github.com/MuriloPedrazzani/grafo-societario"

[tool.hatch.version]
path = "src/grafo_societario/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/grafo_societario"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # regras do proprio ruff
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src", "tests"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
