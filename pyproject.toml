[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "grafo-societario"
description = "Caminhos societários entre empresas brasileiras a partir dos dados abertos de CNPJ"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Murilo Pedrazzani", email = "murilopedrazzani@gmail.com" }]
keywords = ["cnpj", "grafo", "dados-abertos", "receita-federal", "societario"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Private :: Do Not Upload",
]
dynamic = ["version"]
# O conjunto base é **só o que responde consulta**. O caminho de resposta lê
# arrays com NumPy e a biblioteca padrão; nem FastAPI nem uvicorn chegam perto do
# motor de ETL.
#
# A fronteira entre serving e construção já era afirmada por teste — um
# subprocesso importa a aplicação e exige que `duckdb`, `scipy` e `pyarrow` não
# apareçam em `sys.modules`. Mas ela estava imposta só no nível de **import**, e
# a dependência continuava declarada aqui: a imagem de deploy embarcava 58 MB de
# DuckDB que o serving nunca carrega, contradizendo o que o teste afirmava.
#
# É a mesma forma da vistoria de dado pessoal que não abria `.js`: a regra
# existia, a imposição tinha um buraco, e nada acusava. Os megabytes são
# consequência; o achado é a distância entre o que o teste garante e o que o
# empacotamento entrega.
dependencies = [
    "pydantic-settings>=2.7",
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.scripts]
grafo-societario = "grafo_societario.cli:main"

[project.optional-dependencies]
# A porta de entrada do pipeline: `typer` para a interface, `httpx` e `tenacity`
# para falar com a Receita. Nada disto responde consulta, e por isso nada disto
# entra na imagem de deploy — que sobe `uvicorn` direto, sem passar pela CLI.
cli = ["typer>=0.15", "httpx>=0.28", "tenacity>=9.0"]

# O que a **construção** dos artefatos precisa, e que o serving não carrega.
# `components.py` usa `scipy.sparse.csgraph` para rotular os componentes; a API
# lê `componentes.npy` com NumPy e nunca chama o scipy. `duckdb` é o motor de
# ETL do bronze e do silver, e o caminho de resposta nunca o importa — há teste
# em subprocesso exigindo isso.
#
# Manter os grupos separados é o que faz a imagem de deploy **não** embarcar
# biblioteca científica nem motor de banco para responder consulta sobre array
# pré-computado — mesmo motivo pelo qual `graph/csr.py` não importa DuckDB.
build = ["duckdb>=1.1", "scipy>=1.14"]

dev = [
    "grafo-societario[build,cli]",
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4.0",
    # Os stubs entram junto: o mypy roda em modo strict, e a saída para uma
    # biblioteca sem tipos é instalar os tipos, não afrouxar a verificação.
    "scipy-stubs>=1.14",
    # Medidor de memória residente do processo. O teste do CSR precisa afirmar
    # que mapear não carrega, e isso é sobre RSS — não sobre o valor devolvido,
    # que uma implementação que carregasse tudo também acertaria.
    "psutil>=6.0",
    "types-psutil>=6.0",
    # Geração de casos para os testes de propriedade da travessia. O valor
    # dele aqui é achar a forma de grafo que ninguém escreveria à mão, e
    # reduzir o contraexemplo ao caso mínimo.
    "hypothesis>=6.100",
]

[project.urls]
Repository = "https://github.com/MuriloPedrazzani/grafo-societario"

[tool.hatch.version]
path = "src/grafo_societario/__init__.py"

[tool.hatch.build.targets.wheel]
# `web/` mora dentro do pacote de propósito: a API serve a página, e a imagem da
# Fase 8 precisa dela no wheel sem regra de cópia própria. O hatchling já inclui
# os não-Python que estão dentro do pacote — conferido com o próprio builder, que
# lista index.html, app.js e estilo.css. Não há teste disso porque a instalação
# editável do CI não gera RECORD; o que há é `api/web.py` derivar o caminho do
# próprio pacote e derrubar a partida se os arquivos não estiverem lá.
packages = ["src/grafo_societario"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    # Roda por padrão, inclusive no CI. O marcador existe para dar `-m "not lento"`
    # a quem estiver iterando localmente — não para o teste ser pulado onde importa.
    "lento: cria ambiente virtual e instala o pacote do zero; ~90 s",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # regras do proprio ruff
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
